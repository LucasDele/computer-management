<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Inventory</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/pages/computer-inventory.css" />
  </head>
  <body class="w-100 d-flex flex-row h-screen">
    <aside class="w-320 d-flex flex-column border-r border-light-gray gap-5">
      <!-- Section logo -->
      <section class="px-5 pt-5 w-100 d-flex flex-column items-center">
        <div class="w-96 h-96">
          <img class="w-100 h-100" src="../../assets/images/logo/britech-logo.png" alt="Britech logo" />
        </div>
        <h1>BRITECH LAB</h1>
      </section>

      <!-- Navbar -->
      <nav class="px-5 d-flex flex-column gap-2">
        <a class="btn-secondary btn-nav" href="../dashboard.html">DASHBOARD</a>
        <a class="btn-secondary btn-nav btn-secondary__is-active" href="computer-inventory.html">COMPUTER</a>
        <div class="ml-10 d-flex flex-column gap-2">
          <a class="btn-secondary btn-nav btn-secondary__is-active" href="computer-inventory.html">Computers</a>
          <a class="btn-secondary btn-nav" href="computer-specs.html">Specs</a>
        </div>
        <a class="btn-secondary btn-nav" href="../maintenance.html">MAINTENANCE</a>
        <a class="btn-secondary btn-nav" href="../issues.html">ISSUES</a>
        <a class="btn-secondary btn-nav" href="../reports.html">REPORTS</a>
        <a class="btn-secondary btn-nav" href="../accounts.html">ACCOUNTS</a>
      </nav>
    </aside>

    <!-- Right Container -->
    <div class="w-100 overflow-hidden">
      <header class="header__h-10 inventory__header d-flex flex-row items-center justify-between">
        <h2 class="inventory__page-title">Computer Inventory</h2>

        <div class="inventory__user d-flex flex-row items-center gap-3">
          <span class="inventory__avatar d-flex items-center justify-center">AD</span>
          <span class="text-14 font-semibold text-warning">Administrator</span>
          <i class="fa-solid fa-chevron-down text-12 text-gray"></i>
        </div>
      </header>

      <main class="main-container__h-90 inventory__main d-flex flex-column gap-6">
        <!-- Page intro -->
        <p class="inventory__subtitle">Manage and monitor computer laboratory units.</p>

        <!-- Toolbar: search + filters + add -->
        <section id="toolbar" class="d-flex inventory__card inventory__toolbar">
          <div class="inventory__search">
            <i class="fa-solid fa-magnifying-glass inventory__search-icon"></i>
            <input
              class="input inventory__field"
              type="search"
              id="searchInput"
              placeholder="Search PC, Asset ID, Serial Number..."
              aria-label="Search computers"
            />
          </div>

          <select class="select inventory__field inventory__filter" id="statusFilter" aria-label="Filter by status">
            <option value="">All Status</option>
            <option value="Operational">Operational</option>
            <option value="Under Maintenance">Under Maintenance</option>
            <option value="Damaged">Damaged</option>
            <option value="For Replacement">For Replacement</option>
          </select>

          <select class="select inventory__field inventory__filter" id="labFilter" aria-label="Filter by laboratory">
            <option value="">All Laboratories</option>
            <option value="Lab 1">Lab 1</option>
            <option value="Lab 2">Lab 2</option>
            <option value="Lab 3">Lab 3</option>
          </select>

          <select class="select inventory__field inventory__filter" id="categoryFilter" aria-label="Filter by category">
            <option value="">All Categories</option>
            <option value="Desktop">Desktop</option>
            <option value="Laptop">Laptop</option>
            <option value="All-in-One">All-in-One</option>
          </select>

          <button class="btn-primary" type="button" id="addComputerBtn">
            <i class="fa-solid fa-plus"></i>
            Add Computer
          </button>
        </section>

        <!-- Inventory table -->
        <section id="inventoryTable" class="d-flex inventory__card flex-column gap-5">
          <div class="d-flex flex-row items-center justify-between gap-3">
            <h4 class="inventory__card-title">Computer Inventory</h4>
            <span class="inventory__result-count">25 computers</span>
          </div>

          <div class="">
            <p class="text-gray">Coming Soon</p>
          </div>

          <!-- Pagination -->
          <div class="inventory__pagination">
            <span class="inventory__result-count">Showing 1-5 of 25</span>

            <div class="d-flex flex-row items-center gap-2">
              <button class="inventory__page-btn" type="button" id="prevPage" aria-label="Previous page" disabled>
                <i class="fa-solid fa-chevron-left"></i>
              </button>

              <div class="d-flex flex-row items-center gap-2" id="pageNumbers">
                <button class="inventory__page-btn inventory__page-btn__is-active" type="button">1</button>
                <button class="inventory__page-btn" type="button">2</button>
                <button class="inventory__page-btn" type="button">3</button>
                <button class="inventory__page-btn" type="button">4</button>
                <button class="inventory__page-btn" type="button">5</button>
              </div>

              <button class="inventory__page-btn" type="button" id="nextPage" aria-label="Next page">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
          </div>
        </section>

        <form id="computerForm" class="d-none flex-column" action="">
          <div class="d-flex flex-row justify-between">
            <h1>Add Computer</h1>

            <button id="closeComputerBtn" class="btn-secondary">X</button>
          </div>

          <section class="mt-3 d-flex flex-row gap-3">
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">PC Number</label>
              <input class="input" type="text" name="" id="" />
            </div>

            <div class="d-flex flex-column flex-1">
              <label class="label" for="">Status</label>
              <select class="select" name="" id="">
                <option value="Operational">Operational</option>
                <option value="Under Maintenance">Under Maintenance</option>
                <option value="Damaged">Damaged</option>
                <option value="For Replacement">For Replacement</option>
              </select>
            </div>
          </section>

          <section class="mt-3 d-flex flex-row gap-3">
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">RAM</label>
              <input class="input" type="text" name="" id="" />
            </div>
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">Storage</label>
              <input class="input" type="text" name="" id="" />
            </div>
          </section>

          <section class="mt-3 d-flex flex-row gap-3">
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">Operating System</label>
              <input class="input" type="text" name="" id="" />
            </div>
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">GPU</label>
              <input class="input" type="text" name="" id="" />
            </div>
          </section>

          <section class="mt-3 d-flex flex-row gap-3">
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">Motherboard</label>
              <input class="input" type="text" name="" id="" />
            </div>
            <div class="d-flex flex-column flex-1">
              <label class="label" for="">Processor</label>
              <input class="input" type="text" name="" id="" />
            </div>
          </section>

          <button class="mt-5 btn-secondary">Add Computer</button>
        </form>
      </main>
    </div>

    <script type="module" src="../../assets/js/main.js"></script>
    <script type="module" src="../../assets/js/pages/computer-inventory.js"></script>
  </body>
</html>
