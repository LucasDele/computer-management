<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/maintenance.css" />
  </head>
  <body class="w-100 d-flex flex-row h-screen">
    <aside class="w-320 d-flex flex-column border-r border-light-gray gap-5">
      <!-- Section logo -->
      <section class="px-5 pt-5 w-100 d-flex flex-column items-center">
        <div class="w-96 h-96">
          <img class="w-100 h-100" src="../assets/images/logo/britech-logo.png" alt="Britech logo" />
        </div>
        <h1>BRITECH LAB</h1>
      </section>

      <!-- Navbar -->
      <nav class="px-5 d-flex flex-column gap-2">
        <a class="btn-secondary btn-nav" href="dashboard.html">DASHBOARD</a>
        <a class="btn-secondary btn-nav" href="computers/computer-inventory.html">COMPUTER</a>
        <div class="ml-10 d-flex flex-column gap-2">
          <a class="btn-secondary btn-nav" href="computers/computer-inventory.html">Computers</a>
          <a class="btn-secondary btn-nav" href="computers/computer-specs.html">Specs</a>
        </div>
        <a class="btn-secondary btn-nav btn-secondary__is-active" href="maintenance.html" aria-current="page">MAINTENANCE</a>
        <a class="btn-secondary btn-nav" href="issues.html">ISSUES</a>
        <a class="btn-secondary btn-nav" href="reports.html">REPORTS</a>
        <a class="btn-secondary btn-nav" href="accounts.html">ACCOUNTS</a>
      </nav>
    </aside>

    <!-- Right Container -->
    <div class="w-100 overflow-hidden bg-accent">
      <header class="header__h-10 maintenance__header d-flex flex-row items-center justify-between">
        <h2 class="maintenance__page-title">Maintenance</h2>

        <div class="maintenance__user d-flex flex-row items-center gap-3">
          <span class="maintenance__avatar d-flex items-center justify-center">AD</span>
          <span class="text-14 font-semibold text-warning">Administrator</span>
          <i class="fa-solid fa-chevron-down text-12 text-gray" aria-hidden="true"></i>
        </div>
      </header>

      <main>
  <form id="maintenanceForm">
    <section>
      <label for="computer">Computer</label>
      <input type="text" id="computer" name="computer" required />
    </section>

    <section>
      <label for="performedBy">Performed By</label>
      <input type="text" id="performedBy" name="performed_by" required />
    </section>

    <section>
      <label for="maintenanceType">Maintenance Type</label>
      <select id="maintenanceType" name="maintenance_type" required>
        <option value="" disabled selected>Select maintenance type</option>
        <option value="Preventive">Preventive</option>
        <option value="Corrective">Corrective</option>
      </select>
    </section>

    <section>
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" required></textarea>
    </section>

    <section>
      <label for="datePerformed">Date Performed</label>
      <input type="date" id="datePerformed" name="date_performed" required />
    </section>

    <section>
      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="" disabled selected>Select status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
    </section>

    <section>
      <label for="remarks">Remarks</label>
      <textarea id="remarks" name="remarks" rows="3"></textarea>
    </section>

    <div>
      <button type="reset">Clear</button>
      <button type="submit">Save Record</button>
    </div>
  </form>
</main>
    </div>
  </body>
</html>
