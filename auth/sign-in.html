<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Computer Laboratory Inventory System</title>
    <link rel="stylesheet" href="../assets/css/pages/landing.css" />
    <style>
      body {
        background: linear-gradient(135deg, #0f1b2e 0%, #173b6c 50%, #1a5ba8 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #f4b400 !important;
        box-shadow: 0 0 0 3px rgba(244, 180, 0, 0.1);
        background-color: #fffbf0;
      }

      button[type="submit"]:hover {
        background-color: #e0a000 !important;
        box-shadow: 0 6px 20px rgba(244, 180, 0, 0.3);
        transform: translateY(-2px);
      }

      a[href="#"]:hover {
        color: #f4b400 !important;
        text-decoration: underline;
      }

      a[href="sign-up.html"]:hover {
        color: #f4b400 !important;
        text-decoration: underline;
      }

      .logo-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .logo-header img {
        width: 80px;
        height: 80px;
        object-fit: contain;
      }

      .logo-header h1 {
        margin: 0;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="bg-white rounded-lg shadow-lg p-12" style="width: 100%; max-width: 450px; margin: var(--space-16)">
      <!-- Login Header with Logo -->
      <div class="text-center mb-8">
        <div class="logo-header">
          <img src="../assets/images/logo/britech-logo.png" alt="Britech Logo" />
          <h1 class="text-3xl font-bold text-secondary">BRITECH COLLEGE</h1>
        </div>
        <p class="text-sm text-secondary" style="line-height: 1.8; letter-spacing: 0.3px">
          Computer Laboratory Inventory & Maintenance Monitoring System
        </p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <!-- Username/Email Field -->
        <div class="mb-6">
          <label for="username" class="d-block text-black font-semibold text-sm mb-2">Username / Email</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username or email"
            class="w-100 p-3 rounded-sm border-1 bg-white text-sm"
            style="border-color: #e5e7eb; transition: all 0.3s ease"
            required
          />
        </div>

        <!-- Password Field -->
        <div class="mb-6">
          <label for="password" class="d-block text-black font-semibold text-sm mb-2">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            class="w-100 p-3 rounded-sm border-1 bg-white text-sm"
            style="border-color: #e5e7eb; transition: all 0.3s ease"
            required
          />
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-between items-center mb-8" style="gap: var(--space-4); flex-wrap: wrap">
          <div class="d-flex items-center gap-2">
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
              style="
                width: 16px;
                height: 16px;
                cursor: pointer;
                accent-color: #f4b400;
                border: 1px solid #e5e7eb;
                border-radius: 3px;
              "
            />
            <label for="rememberMe" class="text-black text-sm font-medium" style="margin: 0; cursor: pointer"
              >Remember Me</label
            >
          </div>
          <a
            href="#"
            class="text-secondary text-sm font-semibold"
            style="text-decoration: none; transition: all 0.3s ease"
            >Forgot Password?</a
          >
        </div>

        <!-- Login Button -->
        <button
          type="button"
          class="w-100 bg-primary text-secondary p-3 rounded-sm font-bold text-base shadow-md"
          style="border: none; cursor: pointer; transition: all 0.3s ease"
          onclick="window.location.href = '../index.html'"
        >
          Login
        </button>
      </form>
    </div>
  </body>
</html>
